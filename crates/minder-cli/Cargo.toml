[package]
authors.workspace = true
categories = ["command-line-utilities", "development-tools"]
description = "Local-LLM coding-agent harness CLI with mq-based policy/observability hooks"
edition.workspace = true
homepage.workspace = true
keywords = ["agent", "llm", "cli", "coding-agent"]
license.workspace = true
name = "minder-cli"
readme.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "minder"
path = "src/main.rs"

[features]
mcp = ["dep:minder-tools-mcp"]
wasm = ["dep:minder-tools-wasm"]

[dependencies]
async-trait.workspace = true
clap.workspace = true
clap_complete = "4"
crossterm.workspace = true
futures-util.workspace = true
ignore.workspace = true
minder-core.workspace = true
minder-hooks.workspace = true
minder-providers.workspace = true
minder-tools-mcp = {workspace = true, optional = true}
minder-tools-wasm = {workspace = true, optional = true}
minder-tools.workspace = true
mq-lang = {version = "0.8.4", default-features = false, features = ["std", "sync", "file-io"]}
mq-markdown.workspace = true
ratatui.workspace = true
rustyline.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal_size.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
toml = "1"
two-face.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = {workspace = true, features = ["test-util"]}
wiremock = "0.6"
